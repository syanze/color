<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
 <meta name="robots" content="noindex, nofollow">
<title>🎨 syanze's Atelier - Chromatic Transmutation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
--magic-glow-color:173,189,204;
--magic-glow-complement:82,66,51;
--diamond-color:#FD0100;
--diamond-color-rgb:253,1,0;
--diamond-light:#FF807F;
--diamond-dark:#9D0000;
--diamond-shadow:#600000;
--diamond-tip:#9AA1AD;
--page-side:clamp(14px,3.4vw,38px);
--content-width:min(820px,calc(100% - 28px));
--box-padding:clamp(10px,1.8vw,18px);
--mobile-content-inset:clamp(11px,3.2vw,14px);
--result-text-shift:8ch;
--suncatcher-left-anchor:24px;
--suncatcher-right-anchor:calc(100% - 24px);
}
*,*::before,*::after{box-sizing:border-box}
html{
margin:0;
width:100%;
min-height:100%;
overflow-x:auto;
overflow-y:auto;
overflow-anchor:none;
-webkit-text-size-adjust:100%;
text-size-adjust:100%;
touch-action:pan-x pan-y pinch-zoom;
}
body{
margin:0;
width:100%;
min-width:0;
min-height:100vh;
padding:var(--page-side);
padding-left:max(var(--page-side),env(safe-area-inset-left));
padding-right:max(var(--page-side),env(safe-area-inset-right));
background:#fffdf8;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
color:#333;
position:relative;
z-index:0;
overflow-x:visible;
overflow-y:visible;
overflow-anchor:none;
touch-action:pan-x pan-y pinch-zoom;
}
body::before{
content:"";
position:fixed;
z-index:-2;
pointer-events:none;
inset:0;
border-left:var(--page-side) solid transparent;
border-right:var(--page-side) solid transparent;
background:linear-gradient(135deg,#eee4d0 0%,#cdbb99 18%,#e7dac1 35%,#bda985 50%,#e9dec9 68%,#c4b08b 82%,#eee4d0 100%) border-box;
box-shadow:
inset 2px 0 0 #a48b65,
inset -2px 0 0 #a48b65,
inset 6px 0 0 #f1e7d4,
inset -6px 0 0 #f1e7d4,
inset 9px 0 0 #bba47d,
inset -9px 0 0 #bba47d,
inset 18px 0 18px 12px rgba(91,68,38,.32),
inset -18px 0 18px 12px rgba(91,68,38,.32),
0 0 0 1px #8e7654,
0 0 25px rgba(60,43,20,.28);
}
body::after{
content:"";
position:fixed;
z-index:-1;
pointer-events:none;
top:var(--page-side);
bottom:var(--page-side);
left:var(--page-side);
right:var(--page-side);
border-left:3px double #aa8c5c;
border-right:3px double #aa8c5c;
box-shadow:
inset 2px 0 0 rgba(248,238,215,.9),
inset -2px 0 0 rgba(248,238,215,.9),
inset 8px 0 8px rgba(90,65,30,.2),
inset -8px 0 8px rgba(90,65,30,.2);
}
.ornament{
position:fixed;
z-index:100;
width:clamp(65px,7vw,101px);
height:clamp(65px,7vw,101px);
pointer-events:none;
isolation:isolate;
}
.ornament svg{width:100%;height:100%;display:block;overflow:visible}
.ornament.tl{top:-15px;left:0}
.ornament.tr{top:-15px;right:0;transform:scaleX(-1)}
.ornament.bl{bottom:-15px;left:0;transform:scaleY(-1)}
.ornament.br{right:0;bottom:-15px;transform:scale(-1)}
.ornament-main,.ornament-secondary{font-family:Georgia,serif}
.content{
position:relative;
z-index:2;
width:var(--content-width);
max-width:var(--content-width);
min-width:0;
min-height:calc(100vh - (var(--page-side)*2));
margin:0 auto;
padding:0;
}
.content>.box,.title-plate{position:relative;z-index:2}
h1{
color:#2c3e50;
font-size:clamp(1rem,2.5vw,1.6rem);
text-align:center;
margin:0 0 5px;
white-space:nowrap;
}
.subtitle{
text-align:center;
color:#7f8c8d;
font-size:clamp(.7rem,1.7vw,1.1rem);
margin-bottom:25px;
white-space:nowrap;
}
.title-plate{
display:flex;
align-items:center;
justify-content:center;
width:fit-content;
max-width:100%;
margin:0 auto 16px;
padding:8px clamp(10px,2.2vw,18px);
background:linear-gradient(180deg,#b8b8b8 0%,#d0d0d0 16%,#e0e0e0 32%,#E7E7E7 42%,#fff 50%,#E7E7E7 58%,#e0e0e0 68%,#d0d0d0 84%,#b8b8b8 100%);
border:1px solid #aaa;
border-radius:8px;
box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(120,120,120,.3),0 3px 8px rgba(0,0,0,.18);
}
.title-copy{
min-width:0;
width:max-content;
max-width:100%;
}
.title-plate h1{
margin:0 0 3px;
font-size:clamp(.9rem,3vw,1.6rem);
}
.title-plate .subtitle{
margin:0;
font-size:clamp(.68rem,2vw,1.1rem);
}
.box{
width:100%;
max-width:100%;
min-width:0;
background-color:#f4f0e6;
background-image:
radial-gradient(ellipse at 18% 25%,rgba(255,255,255,.48),transparent 38%),
radial-gradient(ellipse at 82% 70%,rgba(190,175,150,.08),transparent 42%),
radial-gradient(ellipse at 45% 90%,rgba(255,255,255,.35),transparent 35%);
padding:var(--box-padding);
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.05);
margin-bottom:14px;
font-family:"Klee One",serif;
color:#202020;
overflow:visible;
}
.box:first-of-type{
background-color:#f8f7f2;
background-image:linear-gradient(rgba(255,255,255,.30),rgba(255,255,255,.30)),url("https://images.unsplash.com/photo-1601662528567-526cd06f6582");
background-size:cover;
background-position:center;
}
.pencil{
font-family:"Klee One",serif;
font-size:15px;
font-weight:600;
line-height:1.2;
color:#202020;
letter-spacing:.2px;
text-shadow:.25px 0 #202020,-.15px .1px rgba(32,32,32,.55),.1px -.15px rgba(32,32,32,.35);
}
.input-group{
display:flex;
gap:clamp(5px,1vw,8px);
align-items:center;
justify-content:center;
flex-wrap:wrap;
position:relative;
z-index:5;
width:100%;
max-width:100%;
min-width:0;
}
label{
font-weight:bold;
font-size:clamp(.82rem,1.5vw,1.15rem);
white-space:nowrap;
min-width:0;
}
input[type=number],input[type=text]{
padding:8px;
font-size:clamp(.9rem,1.4vw,1.1rem);
width:clamp(68px,8vw,90px);
min-width:0;
border:1px solid #ccc;
border-radius:6px;
outline:none;
text-align:center;
font-family:"Klee One",serif;
font-weight:600;
color:#202020;
letter-spacing:.2px;
background:#F8F6F3;
flex:0 1 clamp(68px,8vw,90px);
position:relative;
z-index:6;
}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=text].error,input[type=number].error{border-color:#e00000;background:#fff2f2}
button{
padding:9px clamp(12px,1.8vw,18px);
font-size:clamp(.82rem,1.4vw,1.05rem);
background:#BCE1DF;
color:#fff;
border:0;
border-radius:6px;
cursor:pointer;
transition:background-color .2s,transform .1s,box-shadow .1s;
font-family:"Klee One",serif;
font-weight:600;
box-shadow:0 3px 0 #8fb8b6;
white-space:nowrap;
position:relative;
z-index:6;
touch-action:manipulation;
}
button:hover{background:#acd7d5}
button:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 0 #8fb8b6}
.result-title-container{
display:flex;
align-items:center;
gap:8px;
font-size:clamp(.95rem,1.8vw,1.2rem);
font-weight:bold;
color:#202020;
margin-bottom:8px;
border-bottom:2px solid #eee;
padding-top:0;
padding-right:0;
padding-bottom:6px;
padding-left:var(--result-text-shift);
position:relative;
z-index:2;
min-width:0;
max-width:100%;
}
.result-title-container span{min-width:0}
#diamond,#baseGemDiamond{
width:1em;
height:1em;
display:inline-block;
flex:0 0 1em;
overflow:visible;
vertical-align:middle;
}
#diamond{
filter:drop-shadow(0 0 3px rgba(var(--diamond-color-rgb),.8)) drop-shadow(0 0 7px rgba(var(--diamond-color-rgb),.45));
}
#baseGemDiamond{filter:none}
#diamondSvg,#baseGemDiamondSvg{
width:100%;
height:100%;
display:block;
overflow:visible;
}
.diamond-base{fill:var(--diamond-color);opacity:.90}
.crown-light{fill:var(--diamond-light);opacity:.92}
.crown-base{fill:var(--diamond-color);opacity:.72}
.crown-dark{fill:var(--diamond-dark);opacity:.68}
.crown-white{fill:var(--diamond-light);opacity:.36}
.crown-soft{fill:#fff;opacity:.32}
.crown-left-color{fill:var(--diamond-color);opacity:.82}
.crown-center-soft{fill:var(--diamond-light);opacity:.58}
.girdle-base{fill:var(--diamond-dark);opacity:.62}
.pavilion-light{fill:var(--diamond-light);opacity:.7}
.pavilion-base{fill:var(--diamond-color);opacity:.68}
.pavilion-dark{fill:var(--diamond-dark);opacity:.70}
.pavilion-shadow{fill:var(--diamond-shadow);opacity:.55}
.pavilion-white{fill:var(--diamond-light);opacity:.20}
.pavilion-tip{fill:var(--diamond-tip);opacity:.32}
.result-base-gem-inline{
display:inline-flex;
align-items:center;
gap:3px;
margin:0 2px;
font-family:"Klee One",serif;
font-weight:600;
color:#202020;
line-height:1;
vertical-align:middle;
white-space:nowrap;
}
.result-base-gem-inline svg{width:1.1em;height:1.1em;display:block;flex:0 0 1.1em;overflow:visible}
.result-area{
white-space:pre-wrap;
word-break:normal;
overflow-wrap:anywhere;
line-height:1.45;
font-size:clamp(.72rem,1.22vw,1.05rem);
letter-spacing:-.025em;
color:#202020;
background-color:#f4f0e6;
background-image:
radial-gradient(ellipse at 18% 25%,rgba(255,255,255,.48),transparent 38%),
radial-gradient(ellipse at 82% 70%,rgba(190,175,150,.08),transparent 42%),
radial-gradient(ellipse at 45% 90%,rgba(255,255,255,.35),transparent 35%);
padding-top:10px;
padding-right:10px;
padding-bottom:10px;
padding-left:10px;
border-radius:6px;
border:1px solid #eee;
margin-bottom:10px;
font-family:"Klee One",serif;
font-weight:600;
min-width:0;
max-width:100%;
width:100%;
}
.base-gem-inline{display:none}
.base-gem-inline.active{display:none}
.youtube-section{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
margin-top:8px;
background:transparent;
width:100%;
max-width:100%;
min-width:0;
}
.video-container{
position:relative;
width:100%;
max-width:440px;
aspect-ratio:16/9;
background:#111;
border-radius:6px;
overflow:hidden;
}
.video-placeholder{
position:absolute;
inset:0;
background:#111 center/cover no-repeat;
z-index:3;
opacity:1;
transition:opacity .7s ease;
pointer-events:none;
}
.video-placeholder img{display:block;width:100%;height:100%;object-fit:cover}
.video-container iframe{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
border:0;
border-radius:6px;
z-index:2;
opacity:0;
transition:opacity .15s linear;
}
.video-container iframe.ready{opacity:1}
.video-placeholder.fade-out{opacity:0}
.video-placeholder.hidden{display:none}
</style>
</head>

/* 検索のたびに36個の六角柱へ、色相環全体からバランスよく色を割り当てる。
   - 同じ色・同系色が大量に固まるのを防ぐ
   - 36色を色相環に分散
   - 色の割り当て順は毎回シャッフルしてランダム感を維持
   - 彩度・明度にも少しランダム幅を持たせる
*/
function recolorMagicParticles(){
  const container=document.getElementById("magicParticles");
  if(!container)return;

  const spots=[...container.querySelectorAll(".magic-particle")];
  const count=spots.length;

  if(count===0)return;

  const colors=[];

  // 色相を均等に分散させる。
  // 36個なら約10度ずつ離れる。
  const hueStep=360/count;

  // 今回の検索だけで使う色相環の開始位置をランダム化。
  // これによって毎回同じ色配置にならない。
  const hueOffset=Math.random()*360;

  for(let i=0;i<count;i++){

    // 基本は約10度ずつ離す。
    // ±2度だけ揺らして、機械的になりすぎないようにする。
    const jitter=(Math.random()-0.5)*4;

    let hue=(hueOffset + i*hueStep + jitter)%360;

    if(hue<0)hue+=360;

    // 鮮やかな色を維持しつつ、少しだけ個体差を出す。
    const saturation=86+Math.floor(Math.random()*10); // 86〜95%
    const lightness=47+Math.floor(Math.random()*11);  // 47〜57%

    colors.push(
      `hsl(${hue.toFixed(1)} ${saturation}% ${lightness}%)`
    );
  }

  // 色そのものは分散したまま、
  // 36個への割り当て順だけランダム化する。
  for(let i=colors.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [colors[i],colors[j]]=[colors[j],colors[i]];
  }

  // 六角柱それぞれに別々の色を設定。
  spots.forEach((spot,i)=>{
    spot.style.color=colors[i];
  });
}

output+=`・ 38〜53の宝石いずれか1個 ＞ ${d} ＞ ${obs} ＞ ${ss} ＞ ${ms}\n`;
}else if(target===5){
output+=`・ 38〜53の宝石いずれか1個 ＞ ${d} ＞ ${obs} ＞ ${ms} ＞ ${ms}\n`;
output+=`・ 38〜53の宝石いずれか1個 ＞ ${d} ＞ ${obs} ＞ ${obs} ＞ ${obs}\n`;
output+=`・ 38〜53の宝石いずれか1個 ＞ ${d} ＞ ${obs} ＞ ${obs} ＞ ${ms}\n`;
}
}else{
let zoneName="";
if(target>=6&&target<=21)zoneName="薄色(Pastel Colors)（6〜21）";
else if(target>=22&&target<=37)zoneName="明色(Bright Colors)（22〜37）";
else if(target>=38&&target<=53)zoneName="原色(Vivid Colors)（38〜53）";
else if(target>=54&&target<=69)zoneName="暗色(Dark Colors)（54〜69）";
else if(target>=70&&target<=85)zoneName="濃色(Deep Colors)（70〜85）";

let offset=target<=21?target-6:target<=37?target-22:target<=53?target-38:target<=69?target-54:target-70;
const gemObj=baseGems[offset%16];
const correspondingGem=`${gemObj.ja}(${gemObj.en})`;

updateBaseGemDiamond(target,correspondingGem);

output+=`🌈 所属エリア: ${zoneName}\n`;
output+=`@@BASE_GEM@@ベースとなる原色宝石: 【${correspondingGem}】\n\n`;
output+=`🪶 基本作成レシピ:\n`;

if(target>=38&&target<=53){
output+=`1. ${correspondingGem} ＞ ${correspondingGem} ＞ ${correspondingGem}\n`;
output+=`2. ${correspondingGem} ＞ ${d}\n`;
}else if(target>=22&&target<=37){
output+=`1. ${correspondingGem} × 3個 ＞ ${ss}\n`;
output+=`2. ${correspondingGem} ＞ ${ss} ＞ ${d}\n`;
}else if(target>=6&&target<=21){
output+=`1. ${correspondingGem} × 3個 ＞ ${ss} ＞ ${ss}\n`;
output+=`2. ${correspondingGem} ＞ ${ss} ＞ ${ss} ＞ ${d}\n`;
}else if(target>=54&&target<=69){
output+=`1. ${correspondingGem} × 3個 ＞ ${ms}\n`;
output+=`2. ${correspondingGem} ＞ ${ms} ＞ ${d}\n`;
}else{
output+=`1. ${correspondingGem} × 3個 ＞ ${ms} ＞ ${ms}\n`;
output+=`2. ${correspondingGem} ＞ ${ms} ＞ ${ms} ＞ ${d}\n`;
}
let subs=[];
for(const g1 of baseGems){
if(!combinationMap[g1.num])continue;
for(const g2 of baseGems){
if(combinationMap[g1.num][g2.num]===gemObj.num){
subs.push({
g1:formatGem(g1.ja),
g2:formatGem(g2.ja)
});
}
}
}
if(subs.length){
output+=`\n🏺 【${correspondingGem}】の代用を使った具体的な作成レシピ:\n`;
output+=`（※「${correspondingGem}」の部分を、以下の2つの宝石の組み合わせで置き換えて作ることができます）\n\n`;

subs.forEach((sub,idx)=>{
const pairStr=`${sub.g1} ＞ ${sub.g2}`;
if(target>=38&&target<=53)output+=`${idx+1}. ${pairStr} ＞ ${d}\n`;
else if(target>=22&&target<=37)output+=`${idx+1}. ${pairStr} ＞ ${ss} ＞ ${d}\n`;
else if(target>=6&&target<=21)output+=`${idx+1}. ${pairStr} ＞ ${ss} ＞ ${ss} ＞ ${d}\n`;
else if(target>=54&&target<=69)output+=`${idx+1}. ${pairStr} ＞ ${ms} ＞ ${d}\n`;
else output+=`${idx+1}. ${pairStr} ＞ ${ms} ＞ ${ms} ＞ ${d}\n`;
});
}
}

resultDiv.textContent=output;
insertBaseGemIntoResult(resultDiv);

requestAnimationFrame(()=>{
triggerSparkle();
triggerMagicParticles();
syncResponsiveLayout();
});

return true;
}

function calculateRecipeAfterPaint(){
const inputElem=document.getElementById("targetColor");
if(!inputElem)return;

const committedRawValue=inputElem.value.trim();
const commitId=++commitSerial;

if(pendingCommitFrame!==null){
cancelAnimationFrame(pendingCommitFrame);
pendingCommitFrame=null;
}

const targetAtCommit=Number(committedRawValue);

if(committedRawValue===""||!Number.isInteger(targetAtCommit)||targetAtCommit<1||targetAtCommit>85){
calculateRecipe(committedRawValue);
return;
}

pendingCommitFrame=requestAnimationFrame(()=>{
pendingCommitFrame=null;
if(commitId!==commitSerial)return;
calculateRecipe(committedRawValue);
});
}

window.addEventListener("DOMContentLoaded",()=>{
const targetColor=document.getElementById("targetColor");
const searchButton=document.getElementById("searchButton");

targetColor.addEventListener("input",()=>{
targetColor.classList.remove("error");
});

targetColor.addEventListener("keydown",event=>{
if(event.key==="Enter"){
event.preventDefault();
calculateRecipeAfterPaint();
}
});

searchButton.addEventListener("click",event=>{
event.preventDefault();
calculateRecipeAfterPaint();
});

initBubbles();
initMagicParticles();
recolorMagicParticles();
initYoutubeLazy();
initResponsiveLayoutObserver();

requestAnimationFrame(()=>{
calculateRecipe(targetColor.value.trim());
syncResponsiveLayout();
});

setTimeout(syncResponsiveLayout,120);
setTimeout(syncResponsiveLayout,500);
});
</script>
</body>
</html>
